name: Update Insurance News

on:
  schedule:
    # 매일 한국 시간(KST) 아침 07:00, 점심 12:00, 저녁 18:00 자동 실행 (UTC 기준 22:00, 03:00, 09:00)
    - cron: '0 22,3,9 * * *'
  workflow_dispatch: # GitHub 웹 화면에서 수동 실행 버튼 지원

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 기사 수집 및 Gemini AI 요약 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fetch_and_summarize.py

      - name: 변경된 news_data.json 자동 커밋 및 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add news_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update insurance news [skip ci]" && git push)
